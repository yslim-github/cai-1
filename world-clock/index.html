<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="실시간으로 확인하는 프리미엄 세계 시계 대시보드">
    <title>Premium World Clock - 세계 시계</title>
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="header-logo">
                <i data-lucide="clock" class="logo-icon"></i>
                <div>
                    <h1>World Clock</h1>
                    <p>글로벌 주요 도시의 실시간 시각 대시보드</p>
                </div>
            </div>
            
            <div class="header-controls">
                <!-- 도시 검색 및 추가 -->
                <div class="search-container">
                    <div class="search-input-wrapper">
                        <i data-lucide="search" class="search-icon"></i>
                        <input type="text" id="city-search" placeholder="도시명을 입력하세요 (예: 서울, New York)..." autocomplete="off">
                    </div>
                    <ul id="search-results" class="search-results hidden"></ul>
                </div>
                
                <!-- 테마 토글 버튼 -->
                <button id="theme-toggle" aria-label="테마 전환">
                    <i data-lucide="moon" class="theme-icon"></i>
                </button>
            </div>
        </header>

        <main>
            <div id="world-clock-container" class="clock-grid">
                <!-- 시계 카드가 자바스크립트로 동적 추가됩니다. -->
            </div>
        </main>

        <footer>
            <p>&copy; 2026 Premium World Clock. Designed with Elegance.</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
